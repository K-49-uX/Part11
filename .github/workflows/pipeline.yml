name: build and test

on: [push, pull_request]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check style
        run: npm run eslint

      - name: Run npm test
        run: npm test

      - name: Run npm build
        run: npm run build
