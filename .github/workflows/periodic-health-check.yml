name: Periodic health check

on:
  workflow_dispatch:
    inputs:
      health_check_url:
        description: URL to check (use the default unless simulating a failure)
        required: false
        default: https://fs-pokedex-web.onrender.com/health
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application
        env:
          HEALTH_CHECK_URL: ${{ inputs.health_check_url || 'https://fs-pokedex-web.onrender.com/health' }}
        run: curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 --retry-all-errors "$HEALTH_CHECK_URL"
